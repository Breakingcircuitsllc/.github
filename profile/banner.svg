<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" width="860" height="280">
  <defs>
    <style>
      .bg   { fill: #020a04; }
      .scan { fill: none; }
      .dim  { fill: #003d0f; }
      .mid  { fill: #00b32d; }
      .bright { fill: #00ff41; }
      .amber  { fill: #ffb300; }
      .red    { fill: #ff2244; }
      .cyan   { fill: #00e5ff; }
      .mono   { font-family: 'Courier New', Courier, monospace; }
      .orb    { font-family: 'Courier New', Courier, monospace; font-weight: 700; }

      .fade-in-1 { animation: fadeIn 0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
      .fade-in-2 { animation: fadeIn 0.4s ease forwards; animation-delay: 0.6s; opacity: 0; }
      .fade-in-3 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.0s; opacity: 0; }
      .fade-in-4 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.4s; opacity: 0; }
      .fade-in-5 { animation: fadeIn 0.4s ease forwards; animation-delay: 1.8s; opacity: 0; }
      .fade-in-6 { animation: fadeIn 0.4s ease forwards; animation-delay: 2.2s; opacity: 0; }
      .fade-in-7 { animation: fadeIn 0.4s ease forwards; animation-delay: 2.6s; opacity: 0; }
      .fade-in-8 { animation: fadeIn 0.4s ease forwards; animation-delay: 3.0s; opacity: 0; }
      .fade-in-9 { animation: fadeIn 0.4s ease forwards; animation-delay: 3.4s; opacity: 0; }
      .fade-in-10{ animation: fadeIn 0.4s ease forwards; animation-delay: 3.8s; opacity: 0; }
      .fade-in-11{ animation: fadeIn 0.4s ease forwards; animation-delay: 4.2s; opacity: 0; }
      .fade-in-12{ animation: fadeIn 0.4s ease forwards; animation-delay: 4.6s; opacity: 0; }

      .blink { animation: blink 1s step-end infinite; }

      .title-glow { animation: glowPulse 3s ease-in-out infinite; }

      .scanline {
        animation: scanMove 4s linear infinite;
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }

      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 6px #00ff41); }
        50%       { filter: drop-shadow(0 0 16px #00ff41); }
      }

      @keyframes scanMove {
        0%   { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; r: 4; }
        50%       { opacity: 0.3; r: 2; }
      }

      .pdot { animation: pulseDot 1.4s ease-in-out infinite; }
    </style>

    <filter id="crt">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="280" class="bg"/>

  <!-- Border -->
  <rect x="1" y="1" width="858" height="278" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.3"/>
  <rect x="4" y="4" width="852" height="272" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Scanline sweep (subtle) -->
  <rect class="scanline" x="0" y="0" width="860" height="3" fill="#00ff41" fill-opacity="0.04"/>

  <!-- Corner brackets -->
  <path d="M4 24 L4 4 L24 4" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M836 4 L856 4 L856 24" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M4 256 L4 276 L24 276" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.6"/>
  <path d="M836 276 L856 276 L856 256" fill="none" stroke="#00ff41" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Classification bar -->
  <rect x="0" y="0" width="860" height="18" fill="#ff2244" fill-opacity="0.9"/>
  <text x="430" y="13" text-anchor="middle" class="mono" font-size="8" fill="white" letter-spacing="3" font-weight="700">UNCLASSIFIED // PUBLIC RELEASE // OPEN SOURCE // BREAKING CIRCUITS LLC</text>

  <!-- Left panel — HERO TITLE -->
  <g class="title-glow fade-in-1">
    <text x="36" y="68" class="orb" font-size="44" fill="#00ff41" letter-spacing="-1">BREAKING</text>
    <text x="36" y="114" class="orb" font-size="44" fill="#003d0f" letter-spacing="-1">CIRCUITS</text>
  </g>
  <g class="fade-in-2">
    <text x="36" y="114" class="orb" font-size="44" fill="#00b32d" letter-spacing="-1">CIRCUITS</text>
  </g>

  <!-- Tagline -->
  <g class="fade-in-3">
    <text x="36" y="140" class="mono" font-size="10" fill="#00b32d" letter-spacing="2">POST-QUANTUM · AUTONOMOUS DEFENSE · NO VC · NO DEGREES</text>
  </g>

  <!-- Divider -->
  <g class="fade-in-4">
    <line x1="36" y1="152" x2="380" y2="152" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
  </g>

  <!-- Status rows left panel -->
  <g class="fade-in-5">
    <text x="36"  y="170" class="mono" font-size="11" fill="#003d0f">operator</text>
    <text x="160" y="170" class="mono" font-size="11" fill="#00ff41">BC // SOLO</text>
  </g>
  <g class="fade-in-6">
    <text x="36"  y="186" class="mono" font-size="11" fill="#003d0f">threat_model</text>
    <text x="160" y="186" class="mono" font-size="11" fill="#00e5ff">ASSUME_BREACH</text>
  </g>
  <g class="fade-in-7">
    <text x="36"  y="202" class="mono" font-size="11" fill="#003d0f">crypto_layer</text>
    <text x="160" y="202" class="mono" font-size="11" fill="#00ff41">POST-QUANTUM</text>
  </g>
  <g class="fade-in-8">
    <text x="36"  y="218" class="mono" font-size="11" fill="#003d0f">fingerprint</text>
    <text x="160" y="218" class="mono" font-size="11" fill="#ff2244">NONE</text>
  </g>
  <g class="fade-in-9">
    <text x="36"  y="234" class="mono" font-size="11" fill="#003d0f">wire_profile</text>
    <text x="160" y="234" class="mono" font-size="11" fill="#00ff41">INDISTINGUISHABLE</text>
  </g>

  <!-- Pulse dot + STATUS -->
  <g class="fade-in-10">
    <circle cx="46" cy="257" r="4" fill="#00ff41" class="pdot"/>
    <text x="56" y="261" class="mono" font-size="10" fill="#00ff41" letter-spacing="2">SYSTEMS ONLINE</text>
  </g>

  <!-- Vertical divider -->
  <g class="fade-in-3">
    <line x1="410" y1="24" x2="410" y2="268" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>

  <!-- Right panel — TERMINAL -->
  <g class="fade-in-4">
    <text x="430" y="48" class="mono" font-size="10" fill="#003d0f" letter-spacing="3">// OPEN SOURCE ARSENAL</text>
    <line x1="430" y1="54" x2="848" y2="54" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Repo rows -->
  <g class="fade-in-5">
    <text x="430" y="74" class="mono" font-size="11" fill="#003d0f">$</text>
    <text x="446" y="74" class="mono" font-size="11" fill="#00ff41">QPNE</text>
    <text x="530" y="74" class="mono" font-size="11" fill="#003d0f">5-layer PQC encryptor</text>
    <text x="790" y="74" class="mono" font-size="11" fill="#00ff41" letter-spacing="1">LIVE</text>
  </g>
  <g class="fade-in-6">
    <text x="430" y="92" class="mono" font-size="11" fill="#003d0f">$</text>
    <text x="446" y="92" class="mono" font-size="11" fill="#00ff41">VGLF</text>
    <text x="530" y="92" class="mono" font-size="11" fill="#003d0f">LLM firewall for ICS</text>
    <text x="790" y="92" class="mono" font-size="11" fill="#00ff41" letter-spacing="1">LIVE</text>
  </g>
  <g class="fade-in-7">
    <text x="430" y="110" class="mono" font-size="11" fill="#003d0f">$</text>
    <text x="446" y="110" class="mono" font-size="11" fill="#ffb300">H6S</text>
    <text x="530" y="110" class="mono" font-size="11" fill="#003d0f">Autonomous grid defense</text>
    <text x="754" y="110" class="mono" font-size="11" fill="#ffb300" letter-spacing="1">DEPLOYED</text>
  </g>
  <g class="fade-in-8">
    <text x="430" y="128" class="mono" font-size="11" fill="#003d0f">$</text>
    <text x="446" y="128" class="mono" font-size="11" fill="#ffb300">Robot OS</text>
    <text x="530" y="128" class="mono" font-size="11" fill="#003d0f">Autonomous robotics layer</text>
    <text x="742" y="128" class="mono" font-size="11" fill="#ffb300" letter-spacing="1">WAKING UP</text>
  </g>
  <g class="fade-in-9">
    <text x="430" y="146" class="mono" font-size="11" fill="#003d0f">$</text>
    <text x="446" y="146" class="mono" font-size="11" fill="#ff2244">[REDACTED]</text>
    <text x="530" y="146" class="mono" font-size="11" fill="#003d0f">████████████████████</text>
    <text x="718" y="146" class="mono" font-size="11" fill="#ff2244" letter-spacing="1">CLASSIFIED</text>
  </g>

  <!-- FIPS badges -->
  <g class="fade-in-10">
    <line x1="430" y1="162" x2="848" y2="162" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.2"/>
  </g>

  <g class="fade-in-11">
    <!-- FIPS 203 -->
    <rect x="430" y="172" width="64" height="16" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="462" y="184" text-anchor="middle" class="orb" font-size="9" fill="#00b32d" letter-spacing="1">FIPS 203</text>
    <!-- FIPS 204 -->
    <rect x="502" y="172" width="64" height="16" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="534" y="184" text-anchor="middle" class="orb" font-size="9" fill="#00b32d" letter-spacing="1">FIPS 204</text>
    <!-- FIPS 205 -->
    <rect x="574" y="172" width="64" height="16" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="606" y="184" text-anchor="middle" class="orb" font-size="9" fill="#00b32d" letter-spacing="1">FIPS 205</text>
    <!-- CNSA 2.0 -->
    <rect x="646" y="172" width="64" height="16" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="678" y="184" text-anchor="middle" class="orb" font-size="9" fill="#00b32d" letter-spacing="1">CNSA 2.0</text>
    <!-- EO 14144 -->
    <rect x="718" y="172" width="64" height="16" fill="none" stroke="#00ff41" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="750" y="184" text-anchor="middle" class="orb" font-size="9" fill="#00b32d" letter-spacing="1">EO 14144</text>
  </g>

  <!-- Prompt line -->
  <g class="fade-in-12">
    <text x="430" y="216" class="mono" font-size="12" fill="#003d0f">BC@ops:~$</text>
    <text x="507" y="216" class="mono" font-size="12" fill="#00ff41">git log --all --oneline</text>
  </g>
  <g class="fade-in-12">
    <text x="430" y="234" class="mono" font-size="11" fill="#003d0f">→ I build things that shouldn't exist.</text>
  </g>
  <g class="fade-in-12">
    <text x="430" y="252" class="mono" font-size="12" fill="#003d0f">BC@ops:~$</text>
    <text x="507" y="252" class="mono" font-size="12" fill="#00ff41" class="blink">▋</text>
  </g>

  <!-- Bottom classification bar -->
  <rect x="0" y="262" width="860" height="18" fill="#ff2244" fill-opacity="0.05"/>
  <text x="430" y="274" text-anchor="middle" class="mono" font-size="8" fill="#ff2244" fill-opacity="0.8" letter-spacing="3">© 2026 BREAKING CIRCUITS LLC // ALL OPERATIONS LOGGED // breakingcircuits.com</text>
</svg>
